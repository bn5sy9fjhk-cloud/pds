<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>霍桐PDS · 收藏</title>
<link rel="stylesheet" href="../ui-base.css" />
<link rel="stylesheet" href="user-shell.css" />
</head>
<body data-page="starred">
  <header class="topbar">
    <div class="topbar__left">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 22 22" width="22" height="22"><title>霍桐PDS</title>
          <rect x="3.5" y="3.5" width="15" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M11 8v6M8 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">霍桐PDS</span>
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="breadcrumb-marker" id="listTitle">收藏</span>
    </div>
    <div class="topbar__center-headline" aria-hidden="true"></div>
    <div class="topbar__right">
      <a class="top-admin-entry" href="../admin/overview.html">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2.5l5 2v4.2c0 3-2 5-5 5.3-3-.3-5-2.3-5-5.3V4.5l5-2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 8.2l1.4 1.4L10 6.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        管理中心
      </a>
      <span class="user-chip">
        <span class="avatar">张</span>
        <span class="user-name">张研</span>
      </span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="side-nav" aria-label="主导航">
        <a class="nav-item" data-nav="my-docs" data-href-key="my-docs">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 5.6 3.2 5A1.7 1.7 0 0 1 4.8 3.6h2.8l1.9 1.7h5.7A1.4 1.4 0 0 1 16.6 6.7v9.4A1.3 1.3 0 0 1 15.3 17.4H4.7A1.3 1.3 0 0 1 3.4 16L3 5.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 13l2.5-2L10.5 13l3-3.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>我的文档</span>
        </a>
        <a class="nav-item" data-nav="dept" data-href-key="dept">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h3l2 2h7A1.5 1.5 0 0 1 17.5 7.5v7c0 .8.9-.2.9-2.2V9.5a2 2 0 0 0-2-2H9.6L7.4 5.5H4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>部门空间</span>
        </a>
        <a class="nav-item" data-nav="recent" data-href-key="recent">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 7v3l2 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>最近使用</span>
        </a>
        <a class="nav-item nav-item--on" data-nav="starred" data-href-key="starred">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m10 3.6 1.9 3.9 4.3.6-3.1 3 .7 4.3L10 13.6l-3.8 2 .7-4.3-3.1-3 4.3-.6L10 3.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>收藏</span>
        </a>
        <a class="nav-item" data-nav="trash" data-href-key="trash">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 6h12M8 3.5h4M6 6l.6 9A1.5 1.5 0 0 0 8.1 16.5h3.8a1.5 1.5 0 0 0 1.5-1.4L14 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 9v4.5M11.5 9v4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>回收站</span>
        </a>
      </nav>

      <div class="side-block">
        <p class="side-block__label">部门空间</p>
        <ul class="side-sub">
          <li><a class="tree-row" href="../index.html">研发部</a></li>
          <li><a class="tree-row" href="../index.html">生产部</a></li>
          <li><a class="tree-row" href="../index.html">销售部</a></li>
        </ul>
      </div>

      <div class="side-footer">
        <p class="side-block__label">空间使用情况</p>
        <div class="capacity-label"><span id="idCapUsed">已用 128.4 GB</span><span id="idCapTotal">500 GB</span></div>
        <div class="capacity-track" aria-hidden="true"><i class="capacity-fill"></i></div>
      </div>
    </aside>

    <main class="main">
      <div class="main-toolbar">
        <span class="panel-headline">收藏</span>
        <span class="panel-count"><span id="listCount">0 项</span></span>
      </div>
      <div class="file-panel">
        <div class="read-grid-5 read-head">
          <div>名称</div><div>类型</div><div>大小</div><div>修改时间</div><div>来源</div>
        </div>
        <div class="read-scroll"><div class="read-list" id="listBody"></div></div>
      </div>
    </main>
  </div>

<script src="../ui-scale.js"></script>
<script src="user-shell.js"></script>
</body>
</html>
